name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Typecheck (Lint)
        run: npm run lint

      - name: Run Unit & Regression Tests (CI Isolated)
        run: npm test
        env:
          NODE_ENV: test
          RUN_PROVIDER_INTEGRATION_TESTS: false

      - name: Production Build
        run: npm run build
